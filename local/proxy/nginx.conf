# Nginx atua como gateway estilo Supabase Kong:
#   /auth/v1/* -> GoTrue
#   /rest/v1/* -> PostgREST
# Assim o cliente @supabase/supabase-js fala com VITE_SUPABASE_URL=http://host:8000

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 25m;

  # CORS básico (em produção troque * pelo seu domínio)
  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header Access-Control-Allow-Methods 'GET,POST,PUT,PATCH,DELETE,OPTIONS' always;
  add_header Access-Control-Allow-Headers 'authorization, x-client-info, apikey, content-type, prefer, accept-profile, content-profile, range, x-supabase-api-version' always;
  add_header Access-Control-Expose-Headers 'content-range, content-location' always;

  if ($request_method = OPTIONS) { return 204; }

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PostgREST espera o JWT no Authorization header; supabase-js já manda.
  }

  location = / {
    return 200 'getlicence local supabase ok — /auth/v1 + /rest/v1 disponiveis';
    add_header Content-Type text/plain;
  }
}
